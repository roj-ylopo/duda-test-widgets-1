<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Monaco Editor Widget</title>
	<style>
		#editor-container {
			width: 100%;
			height: 400px;
			border: 1px solid #ccc;
			margin-bottom: 16px;
		}
		.editor-buttons {
			margin-bottom: 16px;
		}
		.editor-buttons button {
			margin-right: 8px;
		}
	</style>
	<!-- Monaco Editor CDN -->
	<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
	<p>{{widgetId}}</p>
	<div class="editor-buttons">
		<button id="save-btn">Save</button>
		<button id="clear-btn">Clear</button>
	</div>
	<div id="editor-container"></div>
	<script>
    // TODO: Check if there i anything usable from the window object that can help get the current code block collection
    console.log('window object:', window);
		// Monaco loader config
		require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
		let editor;
		require(["vs/editor/editor.main"], function () {
			editor = monaco.editor.create(document.getElementById('editor-container'), {
				value: '<!-- Start coding... -->\n',
				language: 'html',
				theme: 'vs-dark',
				automaticLayout: true
			});
		});


		// Save button handler
		// NOTE: This requires a backend endpoint at /save-code that writes the posted data to a JSON file (e.g., test.json).
		// Example Node.js/Express backend code is provided below this HTML.
		document.getElementById('save-btn').addEventListener('click', function () {
			if (editor) {
				const code = editor.getValue();
				fetch('/save-code', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ code })
				})
				.then(response => response.json())
				.then(data => {
					alert('Saved!');
				})
				.catch(err => {
					alert('Save failed: ' + err);
				});
			}
		});

		/*
		// Example Node.js/Express backend (save as server.js):
		const express = require('express');
		const fs = require('fs');
		const app = express();
		app.use(express.json());
		app.post('/save-code', (req, res) => {
			fs.writeFile('src/js/test.json', JSON.stringify({ code: req.body.code }, null, 2), err => {
				if (err) return res.status(500).json({ error: 'Write failed' });
				res.json({ success: true });
			});
		});
		app.listen(3000, () => console.log('Server running on http://localhost:3000'));
		*/

		// Clear button handler
		document.getElementById('clear-btn').addEventListener('click', function () {
			if (editor) {
				editor.setValue('');
			}
		});
	</script>
</body>
</html>
