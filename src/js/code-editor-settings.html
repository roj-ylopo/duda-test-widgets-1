<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Monaco Editor Widget</title>
	<style>
		#editor-container {
			width: 100%;
			height: 400px;
			border: 1px solid #ccc;
			margin-bottom: 16px;
		}
		.editor-buttons {
			margin-bottom: 16px;
		}
		.editor-buttons button {
			margin-right: 8px;
			padding: 8px 12px;
			border-radius: 4px;
			border: 1px solid #ccc;
			background: #f5f5f5;
			cursor: pointer;
		}
		.editor-buttons button:hover {
			background: #e0e0e0;
		}
		.config-section {
			margin-bottom: 16px;
			padding: 16px;
			border: 1px solid #ddd;
			border-radius: 4px;
			background: #f9f9f9;
		}
		.config-section label {
			display: block;
			margin-bottom: 8px;
			font-weight: bold;
		}
		.config-section input, .config-section select {
			width: 200px;
			padding: 4px 8px;
			border: 1px solid #ccc;
			border-radius: 4px;
			margin-left: 8px;
		}
	</style>
	<!-- Monaco Editor CDN -->
	<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
	<p>Widget ID: {{widgetId}}</p>
	<div class="config-section">
		<label>Site Name: <input type="text" id="site-name" placeholder="your-duda-site" value=""></label>
		<label>Collection: <input type="text" id="collection-name" placeholder="code-blocks" value="code-blocks"></label>
		<label>Page Item: <select id="page-item-select" disabled><option value="">Load collection first</option></select></label>
	</div>
	<div class="editor-buttons">
		<button id="load-btn">Load from Duda</button>
		<button id="save-btn">Save to Duda</button>
		<button id="clear-btn">Clear</button>
	</div>
	<div id="editor-container"></div>
	<script>
		// Configuration - Replace with your Lambda function URL
		const LAMBDA_BASE_URL = 'https://t3gv3b9s61.execute-api.us-west-1.amazonaws.com/dev'; // Your actual API Gateway URL
		
		// Monaco loader config
		require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
		let editor;
	let collectionData = null; // Store loaded collection data
	
	require(["vs/editor/editor.main"], function () {
		editor = monaco.editor.create(document.getElementById('editor-container'), {
			});
		});
				const urlParams = new URLSearchParams(window.location.search);
				const {widgetId, accountId, siteId, page, locale, elementId} = Object.fromEntries(urlParams.entries());
				console.log('URL parameters:', Object.fromEntries(urlParams.entries()));
				console.log('Widget ID:', widgetId);
				console.log('Account ID:', accountId);
				console.log('Site ID:', siteId);
				console.log('Page:', page);
				console.log('Locale:', locale);
				console.log('Element ID:', elementId);
				//sample URL parameters
				// accountId: "603e3ab5e36f4c59ab5ad8b507791a53"
				// elementId: "1701745338"
				// locale: "en"
				// page: "about"
				// siteId: "e3fd21df"
				// version: "22"
				// widgetId: "979cb8dd582c4c2f8a362d83f3056018"

		// Load from Duda CMS
		document.getElementById('load-btn').addEventListener('click', async function () {
			console.log('🔄 BUTTON CLICKED! Starting load process...');
			alert('Button clicked! Check console for details.');
			
			try {
				const siteName = siteId || document.getElementById('site-name').value.trim();
				const collectionName = document.getElementById('collection-name').value.trim() || 'code-blocks';
				
				console.log('📝 Site name:', siteName);
				console.log('📝 Collection name:', collectionName); 
				console.log('🌐 Lambda URL:', LAMBDA_BASE_URL);
				
				if (!siteName) {
					console.log('❌ No site name provided');
					alert('Please enter a site name');
					return;
				}
				
				console.log(`🚀 About to fetch from: ${LAMBDA_BASE_URL}/api/sites/${siteName}/collections`);
				
				// First, try to list all collections to see what exists
				console.log('Step 1: Listing all collections...');
				const listResponse = await fetch(`${LAMBDA_BASE_URL}/api/sites/${siteName}/collections`, {
					method: 'GET',
					headers: {
						'Content-Type': 'application/json'
					}
				});
				
				console.log('📡 Response received:', listResponse);
				
				if (listResponse.ok) {
					const collections = await listResponse.json();
					console.log('Available collections:', collections);
					
					if (!collections.find(c => c.name === collectionName)) {
						alert(`Collection "${collectionName}" not found. Available collections: ${collections.map(c => c.name).join(', ')}`);
						return;
					}
				} else {
					console.log('❌ List collections failed, continuing anyway...');
				}
				
				// Now try to get the specific collection
				console.log('Step 2: Getting collection data...');
				const response = await fetch(`${LAMBDA_BASE_URL}/api/sites/${siteName}/collections/${collectionName}`, {
					method: 'GET',
					headers: {
						'Content-Type': 'application/json'
					}
				});
				
				if (!response.ok) {
					const error = await response.text();
					throw new Error(`HTTP ${response.status}: ${error}`);
				}
				
				const data = await response.json();
				console.log('Loaded data from Duda:', data);
			collectionData = data; // Store for dropdown
			
			// Populate dropdown with page items
			const pageItemSelect = document.getElementById('page-item-select');
			pageItemSelect.innerHTML = '<option value="">Select a page item</option>';
			
			if (data && data.values && data.values.length > 0) {
				// data.values.forEach((item, index) => {
				// 	const pageUrl = item.page_item_url || `Item ${index + 1}`;
				// 	const option = document.createElement('option');
				// 	option.value = index;
				// 	option.textContent = pageUrl;
				// 	pageItemSelect.appendChild(option);
				// });
				// pageItemSelect.disabled = false;
				
				// // Auto-select first item and load its content
				// if (data.values[0] && data.values[0].data && data.values[0].data.html) {
				// 	pageItemSelect.value = '0';
				// 	editor.setValue(data.values[0].data.html);
				// 	console.log('Loaded first item:', data.values[0]);
				// 	alert('Collection loaded! Select a page item from dropdown.');
				// } else {
				// 	alert('Collection loaded but no HTML content found in first item.');
				// }
				console.log('Filtering items for current page:', page);
				console.log('All items:', data.values);
				const currentCodeBlocks = data.values.find(item => item.page_item_url === page);
				console.log('Filtered items for current page:', currentCodeBlocks);
				editor.setValue(currentCodeBlocks?.data['editable1-html'] || '<!-- No HTML content found for this page item -->');
			} else {
				alert('No items found in collection');
				console.log('Data structure:', data);
			}
			
		} catch (error) {
				console.error('💥 DETAILED ERROR INFO:');
				console.error('💥 Error message:', error.message);
				console.error('💥 Error stack:', error.stack);
				console.error('💥 Full error object:', error);
				alert('Load failed: ' + error.message + '. Check console for details.');
			}
		});

		// Save to Duda CMS
		document.getElementById('save-btn').addEventListener('click', async function () {
			if (!editor) return;
			
			try {
				const siteName = document.getElementById('site-name').value.trim();
				const collectionName = document.getElementById('collection-name').value.trim();
				const code = editor.getValue();
				
				if (!siteName) {
					alert('Please enter a site name');
					return;
				}
				
// Check if a page item is selected
		const pageItemSelect = document.getElementById('page-item-select');
		const selectedIndex = pageItemSelect.value;
		
		if (!selectedIndex || selectedIndex === '') {
			alert('Please select a page item first');
			return;
		}
		
		const selectedItem = collectionData.values[parseInt(selectedIndex)];
		if (!selectedItem) {
			alert('Selected page item not found');
			return;
		}
		
		console.log(`Saving to Duda: ${siteName}/${collectionName} - Item: ${selectedItem.page_item_url}`);
		
		// Create payload using existing item structure but update the HTML
		const payload = {
			data: {
				...selectedItem.data, // Keep existing data
				html: code, // Update HTML content
				lastUpdated: new Date().toISOString()
			},
			id: selectedItem.id // Include row ID for updates
				};
				
				const response = await fetch(`${LAMBDA_BASE_URL}/api/sites/${siteName}/collections/${collectionName}`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(payload)
				});
				
				if (!response.ok) {
					const error = await response.text();
					throw new Error(`HTTP ${response.status}: ${error}`);
				}
				
				const result = await response.json();
				console.log('Save result:', result);
				alert('Code saved successfully to Duda!');
				
			} catch (error) {
				console.error('Save failed:', error);
				alert('Save failed: ' + error.message);
			}
		});

		// Clear button handler
		document.getElementById('clear-btn').addEventListener('click', function () {
			console.log('🧹 Clear button clicked');
			if (editor) {
				editor.setValue('');
			}
		});

		// Page item dropdown change handler
		document.getElementById('page-item-select').addEventListener('change', function() {
			const selectedIndex = this.value;
			
			if (selectedIndex && collectionData && collectionData.values) {
				const selectedItem = collectionData.values[parseInt(selectedIndex)];
				if (selectedItem && selectedItem.data && selectedItem.data['editable1-html']) {
					console.log('Loading item:', selectedItem.page_item_url);
					editor.setValue(selectedItem.data['editable1-html']);
				} else {
					editor.setValue('<!-- No HTML content found for this item -->');
				}
			}
		});

		// Add a test button to check Lambda connectivity
		console.log('🛠️ Monaco editor setup complete');
		console.log('🌐 Lambda URL configured as:', LAMBDA_BASE_URL);
		
		// Test Lambda connectivity on page load
		setTimeout(async function() {
			try {
				console.log('🧪 Testing basic Lambda connectivity...');
				console.log('🌐 Testing URL:', LAMBDA_BASE_URL);
				
				// Test 1: Simple fetch to base URL
				const testResponse1 = await fetch(LAMBDA_BASE_URL, { 
					method: 'GET',
					mode: 'cors'
				});
				console.log('🧪 Base URL test response status:', testResponse1.status);
				
				// Test 2: Test with /test endpoint  
				const testResponse2 = await fetch(LAMBDA_BASE_URL + '/test', { 
					method: 'GET',
					mode: 'cors',
					headers: {
						'Content-Type': 'application/json'
					}
				});
				console.log('🧪 /test endpoint response status:', testResponse2.status);
				
				// Test 3: Test actual API endpoint
				const testResponse3 = await fetch(LAMBDA_BASE_URL + '/api/sites/test/collections', { 
					method: 'GET',
					mode: 'cors',
					headers: {
						'Content-Type': 'application/json'
					}
				});
				console.log('🧪 API endpoint response status:', testResponse3.status);
				console.log('✅ Lambda connectivity test completed - check logs above');
				
			} catch (error) {
				console.error('🚨 Lambda connectivity test failed:');
				console.error('🚨 Error type:', error.name);
				console.error('🚨 Error message:', error.message);
				console.error('🚨 Full error:', error);
				
				// Additional debugging info
				console.log('🔍 Debugging info:');
				console.log('🔍 Current domain:', window.location.origin);
				console.log('🔍 Lambda URL:', LAMBDA_BASE_URL);
				console.log('🔍 Browser user agent:', navigator.userAgent);
			}
		}, 2000);
	</script>
</body>
</html>
