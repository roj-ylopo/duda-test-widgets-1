<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Monaco Editor Widget</title>
	<style>
		#editor-container {
			width: 100%;
			height: 400px;
			border: 1px solid #ccc;
			margin-bottom: 16px;
		}
		.editor-buttons {
			margin-bottom: 16px;
		}
		.editor-buttons button {
			margin-right: 8px;
		}
	</style>
	<!-- Monaco Editor CDN -->
	<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
	<p>{{widgetId}}</p>
	<div class="editor-buttons">
		<button id="save-btn">Save</button>
		<button id="clear-btn">Clear</button>
	</div>
	<div id="editor-container"></div>
	<script>
    // Monaco loader config
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    let editor;
    // Store code if received before Monaco loads
    window._pendingCode = undefined;

    // Load existing code from localStorage on startup
    function loadFromLocalStorage() {
      const urlParams = new URLSearchParams(window.location.search);
      const siteId = urlParams.get('siteId');
      const elementId = urlParams.get('elementId');
      const uniqueId = `widget_${siteId}_${elementId}`;
      
      const savedCode = localStorage.getItem(uniqueId);
      console.log('Loading from localStorage with key:', uniqueId);
      console.log('Retrieved code:', savedCode);
      
      if (savedCode) {
        if (editor) {
          editor.setValue(savedCode);
        } else {
          window._pendingCode = savedCode;
        }
      }
    }

    // Load saved code after a short delay to ensure Monaco is ready
    setTimeout(loadFromLocalStorage, 200);

    require(["vs/editor/editor.main"], function () {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: window._pendingCode || '<!-- Start coding... -->\n',
        language: 'html',
        theme: 'vs-dark',
        automaticLayout: true
      });
    });

    // Save button handler: save to localStorage
    document.getElementById('save-btn').addEventListener('click', function () {
      if (editor) {
        const code = editor.getValue();
        
        // Get URL parameters to create unique identifier
        const urlParams = new URLSearchParams(window.location.search);
        const siteId = urlParams.get('siteId');
        const elementId = urlParams.get('elementId');
        const widgetId = urlParams.get('widgetId');
        
        const uniqueId = `widget_${siteId}_${elementId}`;
        
        try {
          // Save to localStorage
          localStorage.setItem(uniqueId, code);
          console.log('Saved to localStorage with key:', uniqueId);
          console.log('Saved code:', code);
          alert('Saved!');
        } catch (error) {
          console.error('Error saving to localStorage:', error);
          alert('Save failed: ' + error.message);
        }
      }
    });

    // Clear button handler
    document.getElementById('clear-btn').addEventListener('click', function () {
      if (editor) {
        editor.setValue('');
      }
    });
	</script>
</body>
</html>
