<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Monaco Editor Widget</title>
	<style>
		#editor-container {
			width: 100%;
			height: 400px;
			border: 1px solid #ccc;
			margin-bottom: 16px;
		}
		.editor-buttons {
			margin-bottom: 16px;
		}
		.editor-buttons button {
			margin-right: 8px;
		}
	</style>
	<!-- Monaco Editor CDN -->
	<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
	<p>{{widgetId}}</p>
	<div class="editor-buttons">
		<button id="save-btn">Save</button>
		<button id="clear-btn">Clear</button>
	</div>
	<div id="editor-container"></div>
	<script>
    // Monaco loader config
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    let editor;
    // Store code if received before Monaco loads
    window._pendingCode = undefined;

    // Listen for Duda's init message to set code
    window.addEventListener('message', function(event) {
      console.log('Received message in settings iframe:', event.data);
      
      if (
        event.data &&
        event.data.type === 'duda:widget-settings:init' &&
        event.data.payload
      ) {
        let code = event.data.payload.code || event.data.payload.externalSettings?.code || '';
        
        // Decode if it's base64 encoded
        if (event.data.payload.encoded || (event.data.payload.externalSettings && event.data.payload.externalSettings.encoded)) {
          try {
            code = decodeURIComponent(escape(atob(code)));
          } catch (error) {
            console.error('Error decoding base64 content:', error);
          }
        }
        
        console.log('Initial code from Duda:', code);
        
        if (editor) {
          editor.setValue(code || '<!-- Start coding... -->\n');
        } else {
          window._pendingCode = code || '<!-- Start coding... -->\n';
        }
      }
    });

    // Request initial settings from Duda after a short delay
    setTimeout(() => {
      console.log('Requesting initial settings from Duda');
      window.parent.postMessage({
        type: 'duda:widget-settings:request-init'
      }, '*');
    }, 100);

    require(["vs/editor/editor.main"], function () {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: window._pendingCode || '<!-- Start coding... -->\n',
        language: 'html',
        theme: 'vs-dark',
        automaticLayout: true
      });
    });

    // Save button handler: send code to Duda
    document.getElementById('save-btn').addEventListener('click', function () {
      if (editor) {
        const code = editor.getValue();
        try {
          // Base64 encode the content to avoid JSON parsing issues
          const encodedCode = btoa(unescape(encodeURIComponent(code)));
          console.log('Saving encoded code:', encodedCode);
          
          window.parent.postMessage(
            {
              type: 'duda:widget-settings:update',
              payload: { 
                code: encodedCode,
                encoded: true
              }
            },
            '*'
          );
          console.log('Settings saved successfully');
          alert('Saved!');
        } catch (error) {
          console.error('Error saving settings:', error);
          alert('Save failed: ' + error.message);
        }
      }
    });

    // Clear button handler
    document.getElementById('clear-btn').addEventListener('click', function () {
      if (editor) {
        editor.setValue('');
      }
    });
	</script>
</body>
</html>
